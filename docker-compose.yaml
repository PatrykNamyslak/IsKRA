services:
    postgres:
        image: postgres:18-bookworm
        container_name: postgres
        environment:
            POSTGRES_DB: hackyeah2026
            POSTGRES_USER: hackyeah2026
            POSTGRES_PASSWORD: hackyeah2026
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro,Z
    web:
        build: ./web
        container_name: web
        ports:
            - "3000:3000"
        env_file:
            - path: ./web/.env.local
              required: false
        environment:
            - OPENROUTER_API_KEY
            - OPENROUTER_DEFAULT_MODEL
            - DATABASE_URL=${DATABASE_URL:-postgresql://hackyeah2026:hackyeah2026@postgres:5432/hackyeah2026}
            - PAYLOAD_SECRET=${PAYLOAD_SECRET:-hackyeah2026-payload-super-secret-key}




volumes:
    postgres_data:
