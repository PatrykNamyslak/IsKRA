services:
    postgres:
        image: postgres:18-bookworm
        container_name: postgres
        environment:
            POSTGRES_DB: hackyeah2026
            POSTGRES_USER: hackyeah2026
            POSTGRES_PASSWORD: hackyeah2026
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql
            - ./postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    web:
        build: ./web
        container_name: web
        ports:
            - "3000:3000"


volumes:
    postgres_data:
